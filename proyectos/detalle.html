<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#07131D" name="theme-color"/>
<title>Proyecto | Nexo Agencia Creativa</title>
<meta content="Caso de estudio de Nexo Agencia Creativa." name="description"/>
<meta content="Proyecto | Nexo Agencia Creativa" property="og:title"/>
<meta content="Caso de estudio de Nexo Agencia Creativa." property="og:description"/>
<meta content="website" property="og:type"/>
<meta content="__SITE_URL__/assets/img/og-cover.png" property="og:image"/>
<meta content="summary_large_image" name="twitter:card"/>
<link href="../assets/img/favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="../assets/styles.css" rel="stylesheet"/>
<meta content="Nexo Agencia Creativa" property="og:site_name"/>
<link rel="canonical" id="canonical-link" href="" />
</head>
<body data-page="proyectos/detalle.html">
<header class="site-header" data-header="">
<nav aria-label="Navegación principal" class="site-nav">
<a aria-label="Nexo Agencia Creativa, inicio" class="brand" href="../index.html">
<img alt="Nexo Agencia Creativa" class="brand__isotipo" height="42" src="../assets/img/nexo-isotipo-green.png" width="42"/>
</a>
<div class="nav-links">
<a aria-current="page" class="nav-link" href="../proyectos/index.html">PROYECTOS</a>
<a class="nav-link" href="../servicios.html">SERVICIOS</a>
<a class="nav-link" href="../index.html#metodo">MÉTODO</a>
<a class="nav-link" href="../estudio.html">ESTUDIO</a>
<a class="nav-link nav-link--cta" href="../iniciar-proyecto.html">INICIAR PROYECTO ↗</a>
</div>
</nav>
</header>

<main id="contenido">
  <div id="loading-state" style="padding: 120px 20px; text-align: center; color: white;">Cargando proyecto...</div>
  <div id="error-state" style="display: none; padding: 120px 20px; text-align: center; color: white;">
    <h2>Proyecto no encontrado</h2>
    <a href="../proyectos/index.html" class="btn btn--green">Volver a proyectos</a>
  </div>
  
  <div id="client-content" style="display: none;">
    <section class="case-hero" id="client-hero" style="background-color: var(--bg-dark); min-height: auto; padding: 120px 0 60px;">
      <div class="container case-hero__content">
        <div class="hero-top-actions" style="margin-bottom: 2rem;">
          <nav aria-label="Migas de pan" class="breadcrumbs"><ol><li><a href="../index.html">Inicio</a></li><li><a href="index.html">Proyectos</a></li><li aria-current="page" id="breadcrumb-name"></li></ol></nav>
          <a class="btn-back" href="index.html">← VOLVER</a>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4rem; align-items: center;">
          <div>
            <div class="hero-brand-lockup"><img alt="Nexo Agencia Creativa" class="hero-brand__wordmark" src="../assets/img/nexo-logo-full-white.png"/></div>
            <span class="eyebrow" id="client-category-label"></span>
            <h1 class="display-xl" id="client-title"></h1>
            <div class="case-meta">
              <span id="meta-client"></span>
              <span id="meta-services"></span>
              <span id="meta-sector"></span>
            </div>
          </div>
          <div style="text-align: center; display: flex; justify-content: center;" id="client-cover-container">
            <img id="client-cover-img" src="" alt="Portada del proyecto" style="max-width: 100%; height: auto; max-height: 75vh; object-fit: contain; border-radius: 16px; display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.6);">
          </div>
        </div>
      </div>
    </section>
    
    <section class="section">
      <div class="container case-section-grid">
        <h2>Resumen</h2>
        <div>
          <p class="lead" id="client-summary"></p>
        </div>
      </div>
    </section>

    <section class="section section--paper">
      <div class="container case-section-grid">
        <h2>Trabajo desarrollado</h2>
        <div>
          <p class="lead" id="client-work"></p>
        </div>
      </div>
    </section>

    <section class="section section--blue" id="publications-section" style="display: none;">
      <div class="container">
        <span class="eyebrow">Publicaciones de Instagram</span>
        <div class="case-gallery" id="publications-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 2rem;">
          <!-- Publicaciones inyectadas dinámicamente -->
        </div>
      </div>
    </section>

    <section class="section" id="instagram-cta-section" style="text-align: center; padding: 4rem 20px;">
      <a href="#" id="instagram-link" class="btn btn--green" target="_blank" rel="noopener noreferrer">VER CUENTA EN INSTAGRAM</a>
    </section>
  </div>
</main>

<script type="module">
  import { getClientBySlug, getClientPublications } from '../assets/js/content-service.js';
  import { renderMediaFrame, bindVideoControls } from '../assets/js/media-frame.js';
  
  document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    
    if (!slug) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'block';
      return;
    }
    
    const client = await getClientBySlug(slug);
    
    if (!client) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'block';
      return;
    }
    
    // Apply Client Colors
    const root = document.documentElement;
    if (client.primaryColor) root.style.setProperty('--accent-color', client.primaryColor);
    if (client.backgroundColor) document.getElementById('client-hero').style.backgroundColor = client.backgroundColor;
    
    // Update SEO
    document.title = `${client.name} | Caso de estudio Nexo`;
    document.getElementById('canonical-link').href = window.location.href;
    
    // Render Client
    document.getElementById('breadcrumb-name').textContent = client.name;
    document.getElementById('client-title').textContent = client.name;
    document.getElementById('client-category-label').textContent = `CASO DE ESTUDIO / ${client.category?.toUpperCase() || ''}`;
    
    document.getElementById('meta-client').textContent = `Cliente: ${client.name}`;
    document.getElementById('meta-services').textContent = `Servicios: ${(client.services || []).join(' · ')}`;
    document.getElementById('meta-sector').textContent = `Sector: ${client.industry || client.category} · Año: ${client.year || ''}`;
    
    // Inject JSON-LD
    const jsonLd = {
      "@context": "https://schema.org",
      "@type": "CreativeWork",
      "name": `Caso de estudio: ${client.name}`,
      "author": {
        "@type": "Organization",
        "name": "Nexo Agencia Creativa"
      },
      "about": {
        "@type": "Organization",
        "name": client.name
      },
      "text": client.shortDescription || client.summary || ''
    };
    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.textContent = JSON.stringify(jsonLd);
    document.head.appendChild(script);

    document.getElementById('client-summary').textContent = client.shortDescription || client.summary || '';
    document.getElementById('client-work').textContent = client.longDescription || client.workDeveloped || client.challenge || '';
    
    if (client.coverImageUrl || client.coverImage) {
      const coverImg = document.getElementById('client-cover-img');
      coverImg.src = client.coverImageUrl || client.coverImage;
      coverImg.style.display = 'block';
    } else {
      document.getElementById('client-cover-container').style.display = 'none';
    }
    
    const igUrl = client.instagramUrl || client.instagramProfileUrl;
    if (igUrl) {
      document.getElementById('instagram-link').href = igUrl.split('?')[0]; // Remove parameters
    } else {
      document.getElementById('instagram-cta-section').style.display = 'none';
    }
    
    // Fetch publications
    const publications = await getClientPublications(client.id || client.slug);
    
    // Filtrar publicaciones que correspondan a este placement
    const galleryPubs = publications.filter(p => !p.placements || p.placements.includes('clientGallery'));
    
    if (galleryPubs && galleryPubs.length > 0) {
      const container = document.getElementById('publications-container');
      container.removeAttribute('style'); // Remove inline styles, rely on CSS class
      
      // Aplicar clase estructural (CSS Grid Editorial) según la cantidad
      const count = galleryPubs.length;
      let gridClass = 'gallery-grid--default';
      if (count === 1) gridClass = 'gallery-grid--1';
      else if (count === 2) gridClass = 'gallery-grid--2';
      else if (count === 3) gridClass = 'gallery-grid--3';
      else if (count >= 4 && count <= 6) gridClass = 'gallery-grid--editorial';
      
      container.className = `case-gallery ${gridClass}`;
      
      galleryPubs.forEach(pub => {
        const figure = document.createElement('figure');
        figure.className = 'gallery-item';
        figure.innerHTML = renderMediaFrame(pub, client);
        container.appendChild(figure);
      });
      document.getElementById('publications-section').style.display = 'block';
      
      // Bind video events
      bindVideoControls();
    }
    
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('client-content').style.display = 'block';
  });
</script>
</body>
</html>
